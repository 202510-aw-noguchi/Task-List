<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理ページ</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-weak: rgba(37, 99, 235, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    }
    .page { max-width: 920px; margin: 0 auto; }
    .header {
      position: relative;
      padding: 20px 24px;
      background: linear-gradient(135deg, #ffffff, #f1f5ff);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(31, 41, 55, 0.06);
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0.02em; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .auth {
      position: absolute;
      top: 18px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth strong { color: var(--text); }
    .auth button {
      border: 1px solid var(--border);
      background: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .card {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(31, 41, 55, 0.06);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 4px;
      text-align: left;
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }
    tr:last-child td { border-bottom: none; }
    .menu-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .menu-label .en {
      color: var(--muted);
      font-size: 12px;
    }
    .menu-link {
      color: inherit;
      text-decoration: none;
      display: block;
    }
    .menu-link:hover .menu-label {
      color: var(--accent);
    }
    .link-cell a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-weak);
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.08s ease, background 0.2s ease;
    }
    .link-cell {
      width: 40px;
      text-align: left;
      padding-left: 0;
      padding-right: 0;
    }
    .menu-cell {
      padding-left: 0;
      text-align: left;
    }
    .link-cell a:hover {
      background: rgba(37, 99, 235, 0.16);
      transform: translateX(2px);
    }
    .footer { margin-top: 14px; }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>管理ページ</h1>
      <div class="sub">Admin Console</div>

      <div class="auth" sec:authorize="isAuthenticated()">
        <span>ログイン中: <strong sec:authentication="name">user</strong></span>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit">ログアウト</button>
        </form>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>リンク / Link</th>
            <th>メニュー / Menu</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="link-cell"><a th:href="@{/admin/todos}">▶</a></td>
            <td class="menu-cell">
              <a class="menu-link" th:href="@{/admin/todos}">
                <div class="menu-label">
                  <span>全ToDo一覧</span>
                  <span class="en">All Todos</span>
                </div>
              </a>
            </td>
          </tr>
          <tr>
            <td class="link-cell"><a th:href="@{/admin/users}">▶</a></td>
            <td class="menu-cell">
              <a class="menu-link" th:href="@{/admin/users}">
                <div class="menu-label">
                  <span>ユーザー一覧/管理</span>
                  <span class="en">User List / Manage</span>
                </div>
              </a>
            </td>
          </tr>
          <tr>
            <td class="link-cell"><a th:href="@{/admin/groups}">▶</a></td>
            <td class="menu-cell">
              <a class="menu-link" th:href="@{/admin/groups}">
                <div class="menu-label">
                  <span>グループ管理</span>
                  <span class="en">Group Management</span>
                </div>
              </a>
            </td>
          </tr>
          <tr>
            <td class="link-cell"><a th:href="@{/admin/report}">▶</a></td>
            <td class="menu-cell">
              <a class="menu-link" th:href="@{/admin/report}">
                <div class="menu-label">
                  <span>レポート生成</span>
                  <span class="en">Generate Report</span>
                </div>
              </a>
            </td>
          </tr>
          <tr>
            <td class="link-cell"><a th:href="@{/export/csv}">▶</a></td>
            <td class="menu-cell">
              <a class="menu-link" th:href="@{/export/csv}">
                <div class="menu-label">
                  <span>CSVダウンロード</span>
                  <span class="en">Download CSV</span>
                </div>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer">
      <a th:href="@{/}">一覧へ戻る</a>
    </div>
  </div>
</body>
</html>
