<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ユーザー管理</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-weak: rgba(37, 99, 235, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    }
    .page { max-width: 980px; margin: 0 auto; }
    .header {
      position: relative;
      padding: 20px 24px;
      background: linear-gradient(135deg, #ffffff, #f1f5ff);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(31, 41, 55, 0.06);
    }
    .header .auth { max-width: 45%; }
    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0.02em; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .auth {
      position: absolute;
      top: 18px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .auth strong { color: var(--text); }
    .auth button {
      border: 1px solid var(--border);
      background: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .breadcrumbs {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }
    .breadcrumbs a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .breadcrumb-sep {
      color: #9ca3af;
    }
    .card {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(31, 41, 55, 0.06);
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--text);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 160px 120px;
      gap: 12px;
      align-items: end;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #fff;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button.ghost {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.danger {
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 12px 10px;
      text-align: left;
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }
    tr:last-child td { border-bottom: none; }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .alert {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
    }
    .alert.success {
      background: rgba(16, 185, 129, 0.12);
      color: #0f766e;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .alert.error {
      background: rgba(239, 68, 68, 0.12);
      color: #b91c1c;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .footer { margin-top: 14px; }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    @media (max-width: 1025px) {
      .header { padding: 16px 18px; }
      .header-title { gap: 10px; }
      .header-logo { width: 40px; height: 40px; }
      h1 { font-size: 22px; }
      .header .auth { max-width: 50%; }
    }
    @media (max-width: 750px) {
      .header {
        display: grid;
        grid-template-columns: 1fr;
        row-gap: 10px;
      }
      .header .auth {
        position: static;
        justify-content: flex-start;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="header-title">
        <img class="header-logo" src="/images/animal_hashibirokou_manage.png" alt="アイコン" />
        <div>
          <h1>ユーザー管理</h1>
          <div class="sub">Create / Edit / Delete</div>
        </div>
      </div>

      <div class="auth" sec:authorize="isAuthenticated()">
        <span>ログイン中: <strong sec:authentication="name">user</strong></span>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit">ログアウト</button>
        </form>
      </div>
    </div>

    <nav class="breadcrumbs" aria-label="breadcrumb">
      <a th:href="@{/}">トップ</a>
      <span class="breadcrumb-sep">/</span>
      <a th:href="@{/admin}" th:text="#{action.adminPage}">管理画面</a>
      <span class="breadcrumb-sep">/</span>
      <a th:href="@{/admin/users}">ユーザー一覧</a>
      <span class="breadcrumb-sep">/</span>
      <span>ユーザー管理</span>
    </nav>

    <div class="alert success" th:if="${message}" th:text="${message}">成功</div>
    <div class="alert error" th:if="${error}" th:text="${error}">エラー</div>

    <div class="card">
      <h2>新規ユーザー追加</h2>
      <div class="sub">ユーザー名は8文字以上を推奨。パスワードは8文字以上で設定。</div>
      <form th:action="@{/admin/users/manage/create}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-row">
          <div>
            <label>ユーザー名</label>
            <input type="text" name="username" required />
          </div>
          <div>
            <label>パスワード</label>
            <input type="password" name="password" required />
          </div>
          <div>
            <label>メールアドレス</label>
            <input type="email" name="email" placeholder="example@example.com" />
          </div>
          <div>
            <label>権限</label>
            <select name="role">
              <option value="ROLE_USER">ROLE_USER</option>
              <option value="ROLE_ADMIN">ROLE_ADMIN</option>
            </select>
          </div>
          <div>
            <button class="primary" type="submit">作成</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>既存ユーザー管理</h2>
      <div class="sub">タスクが残っているユーザーは削除できません。</div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>ユーザー名</th>
            <th>メールアドレス</th>
            <th>権限</th>
            <th>削除</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.username}">admin</td>
            <td>
              <form th:action="@{/admin/users/manage/role}" method="post" class="actions">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="userId" th:value="${u.id}" />
                <input type="hidden" name="role" th:value="${u.role}" />
                <input type="email" name="email" th:value="${u.email}" placeholder="example@example.com" />
                <button class="ghost" type="submit">更新</button>
              </form>
            </td>
            <td>
              <form th:action="@{/admin/users/manage/role}" method="post" class="actions">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="userId" th:value="${u.id}" />
                <select name="role">
                  <option value="ROLE_USER" th:selected="${u.role == 'ROLE_USER'}">ROLE_USER</option>
                  <option value="ROLE_ADMIN" th:selected="${u.role == 'ROLE_ADMIN'}">ROLE_ADMIN</option>
                </select>
                <button class="ghost" type="submit">更新</button>
              </form>
            </td>
            <td>
              <form th:action="@{/admin/users/manage/delete}" method="post" onsubmit="return confirm('削除しますか？');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="userId" th:value="${u.id}" />
                <button class="danger" type="submit">削除</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="footer">
      <a th:href="@{/admin/users}">ユーザー一覧へ戻る</a>
    </div>
  </div>
</body>
</html>
