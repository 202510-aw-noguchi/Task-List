<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>リマインダーメール送信元設定</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-weak: rgba(37, 99, 235, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    .header {
      position: relative;
      padding: 20px 24px;
      background: linear-gradient(135deg, #ffffff, #f1f5ff);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(31, 41, 55, 0.06);
    }
    .header .auth { max-width: 45%; }
    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.02em;
    }

    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .sub.spaced {
      margin-bottom: 1em;
    }

    .auth {
      position: absolute;
      top: 18px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .auth strong {
      color: var(--text);
    }

    .auth button {
      border: 1px solid var(--border);
      background: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .breadcrumbs {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }
    .breadcrumbs a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .breadcrumb-sep {
      color: #9ca3af;
    }

    .card {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(31, 41, 55, 0.06);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 160px;
      gap: 12px;
      align-items: end;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #fff;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button.ghost {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 12px 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .alert {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.12);
      color: #0f766e;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.12);
      color: #b91c1c;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer {
      margin-top: 14px;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    @media (max-width: 1025px) {
      .header { padding: 16px 18px; }
      .header-title { gap: 10px; }
      .header-logo { width: 40px; height: 40px; }
      h1 { font-size: 22px; }
      .header .auth { max-width: 50%; }
    }
    @media (max-width: 750px) {
      .header {
        display: grid;
        grid-template-columns: 1fr;
        row-gap: 10px;
      }
      .header .auth {
        position: static;
        justify-content: flex-start;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="header">
      <div class="header-title">
        <img class="header-logo" src="/images/animal_hashibirokou_manage.png" alt="アイコン" />
        <div>
          <h1>リマインダーメール送信元設定</h1>
          <div class="sub">Reminder Sender Settings</div>
        </div>
      </div>

      <div class="auth" sec:authorize="isAuthenticated()">
        <span>ログイン中: <strong sec:authentication="name">user</strong></span>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit">ログアウト</button>
        </form>
      </div>
    </div>

    <nav class="breadcrumbs" aria-label="breadcrumb">
      <a th:href="@{/}">トップ</a>
      <span class="breadcrumb-sep">/</span>
      <a th:href="@{/admin}" th:text="#{action.adminPage}">管理画面</a>
      <span class="breadcrumb-sep">/</span>
      <span>メール設定</span>
    </nav>

    <div class="alert success" th:if="${message}" th:text="${message}">更新しました</div>
    <div class="alert error" th:if="${error}" th:text="${error}">エラー</div>

    <div class="card">
      <h2>送信元設定</h2>
      <div class="sub spaced">Gmail のアドレスとアプリパスワードを保存します。</div>
      <form th:action="@{/admin/mail-settings/save}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-grid">
          <div>
            <label>Gmail アドレス</label>
            <input type="email" name="username" th:value="${settings.username}" required />
          </div>
          <div>
            <label>アプリパスワード</label>
            <input type="password" name="appPassword" placeholder="変更時のみ入力" />
          </div>
          <div>
            <label>From アドレス</label>
            <input type="email" name="fromAddress" th:value="${settings.fromAddress}" />
          </div>
          <div>
            <button class="primary" type="submit">保存</button>
          </div>
        </div>
        <div class="hint">※パスワード欄が空の場合は既存値を保持します。</div>
      </form>
    </div>

    <div class="card">
      <h2>テストメール送信</h2>
      <div class="sub spaced">送信先アドレスを指定してテスト送信します。</div>
      <form th:action="@{/admin/mail-settings/test}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-grid">
          <div>
            <label>送信先メールアドレス</label>
            <input type="email" name="to" placeholder="example@example.com" required />
          </div>
          <div></div>
          <div></div>
          <div>
            <button class="primary" type="submit">テスト送信</button>
          </div>
        </div>
      </form>
      <div class="hint">※開発環境ではログ出力で確認ができます。</div>
    </div>

    <div class="footer">
      <a th:href="@{/admin}">管理トップへ戻る</a>
    </div>
  </div>
</body>

</html>
